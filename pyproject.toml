[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "c2score"
version = "0.1.0"
description = "C2-score: quantitative quality evaluation of property graph schemas without ground truth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Fusuke Yukawa" },
    { name = "Hiroaki Shiokawa" },
]
keywords = ["property graph", "graph database", "schema", "schema quality", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "numpy",
    "neo4j>=5,<6",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/kde-salt/c2score"

[tool.hatch.build.targets.wheel]
packages = ["src/c2score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
